  // ---------- compare ----------
  function renderCompare() {
    var list = picked.map(function (id) { return byId[id]; });
    var addable = CHAIRS.filter(function (c) { return picked.indexOf(c.id) === -1; })
      .sort(function (a, b) { return a.title.localeCompare(b.title); });
    var picker = picked.length < MAX_PICK
      ? '<label class="field" style="min-width:260px">Add a chair<select class="select" id="addPick"><option value="">Choose…</option>' +
        addable.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(splitTitle(c.title).name) + '</option>'; }).join('') + '</select></label>'
      : '<p class="section-hint">3 chairs picked. Remove one to add another.</p>';

    var head = '<div class="compare-head"><div><h1 tabindex="-1">Compare chairs</h1><p class="lede">Up to 3 chairs side by side. Values are copied exactly from the chair files.</p></div>' + picker + '</div>';

    if (!list.length) {
      app.innerHTML = '<div class="view">' + head + '<div class="empty"><h2>No chairs picked yet</h2><p>Choose a chair above, or press “+ Compare” on any chair in the list.</p><a class="btn" href="#">Go to all chairs</a></div></div>';
      bindPicker();
      return;
    }

    function bestIdx(getter, dir) {
      var vals = list.map(getter);
      var known = vals.filter(function (v) { return v != null; });
      if (known.length < 2) return -1;
      var best = dir > 0 ? Math.max.apply(null, known) : Math.min.apply(null, known);
      var hits = vals.filter(function (v) { return v === best; }).length;
      return hits === known.length ? -1 : vals.indexOf(best);
    }
    var cheap = bestIdx(function (c) { return c.d.price; }, -1);
    var low = bestIdx(function (c) { return c.d.seatMin; }, -1);
    var shallow = bestIdx(function (c) { return c.d.depthMin; }, -1);
    var BEST = { lowest_price_seen_php: [cheap, 'Cheapest'], seat_height_cm: [low, 'Lowest seat'], seat_depth_cm: [shallow, 'Shortest seat'] };

    var cols = list.map(function (c) {
      var t = splitTitle(c.title);
      return '<th scope="col"><div class="cmp-photo">' + img(c, 400) + '</div><a class="cmp-name" href="#chair/' + esc(c.id) + '">' + esc(t.name) + '</a>' +
        '<button type="button" class="btn small" data-remove="' + esc(c.id) + '">Remove</button></th>';
    }).join('');
    var body = '';
    body += '<tr><th scope="row">Where (Philippines)</th>' + list.map(function (c) { return '<td>' + esc(placesText(c)) + '</td>'; }).join('') + '</tr>';
    body += '<tr><th scope="row">New in Japan (≈ ₱)</th>' + list.map(function (c) { return '<td>' + (c.d.priceJP == null ? 'not known' : jpLine(c)) + '</td>'; }).join('') + '</tr>';
    var bestValue = bestIdx(function (c) { return c.d.valuePct; }, -1);
    body += '<tr><th scope="row">Value</th>' + list.map(function (c, i) {
      return '<td' + (i === bestValue ? ' class="best"' : '') + '>' + (i === bestValue ? '<span class="best-tag">Best value</span>' : '') + VALUE_LABEL[c.d.value] +
        (c.d.valuePct != null ? ' (' + Math.round(c.d.valuePct) + '% of new in Japan)' : '') + '</td>';
    }).join('') + '</tr>';
    var bestTier = bestIdx(function (c) { return c.d.tierNum; }, -1);
    body += '<tr><th scope="row">Model tier</th>' + list.map(function (c, i) {
      return '<td' + (i === bestTier ? ' class="best"' : '') + '>' + (i === bestTier ? '<span class="best-tag">Highest tier</span>' : '') + esc(tierText(c)) +
        (c.d.tier ? '<br><small>' + esc(c.d.tier.series) + '</small>' : '') + '</td>';
    }).join('') + '</tr>';
    GROUPS.forEach(function (g) {
      body += '<tr class="row-group"><th scope="rowgroup" colspan="' + (list.length + 1) + '">' + esc(g.title) + '</th></tr>';
      g.keys.forEach(function (k) {
        body += '<tr><th scope="row">' + esc(label(k)) + '</th>' + list.map(function (c, i) {
          var b = BEST[k];
          var isBest = b && b[0] === i;
          return '<td' + (isBest ? ' class="best"' : '') + '>' + (isBest ? '<span class="best-tag">' + b[1] + '</span>' : '') + esc(c.fields[k] == null ? '' : c.fields[k]) + '</td>';
        }).join('') + '</tr>';
      });
    });
    ['Pros', 'Cons'].forEach(function (name) {
      body += '<tr class="row-group"><th scope="rowgroup" colspan="' + (list.length + 1) + '">' + name + '</th></tr>';
      body += '<tr><th scope="row">' + name + '</th>' + list.map(function (c) {
        var s = sectionByName(c, new RegExp('^' + name, 'i'));
        return '<td><div class="md">' + (s ? s.html : '') + '</div></td>';
      }).join('') + '</tr>';
    });

    app.innerHTML = '<div class="view">' + head +
      '<div class="table-wrap"><table class="compare-table" style="min-width:' + (120 + list.length * 190) + 'px"><thead><tr><th scope="col"><span class="sr-only">Fact</span></th>' + cols + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    '</div>';
    bindPicker();
    app.querySelectorAll('[data-remove]').forEach(function (b) {
      b.addEventListener('click', function () {
        picked = picked.filter(function (id) { return id !== b.dataset.remove; });
        savePicks();
        renderCompare();
      });
    });
  }
  function bindPicker() {
    var sel = document.getElementById('addPick');
    if (!sel) return;
    sel.addEventListener('change', function () {
      if (sel.value && picked.length < MAX_PICK && picked.indexOf(sel.value) === -1) {
        picked.push(sel.value);
        savePicks();
        renderCompare();
      }
    });
  }

          '<div class="tok-title"><strong>' + esc(t.name) + '</strong>' + (t.sub && !c.video ? ' · ' + esc(t.sub) : '') + '</div>' +
          (c.video ? '' : (c.d.price != null ? '<span class="tok-price">' + peso(c.d.price) + '</span>' : '<span class="tok-price">Price ?</span>') +
          '<div class="tok-chips">' + tokChips(c) + '</div>') +
          '<div class="tok-tags">' + esc(tokTags(c)) + '</div>' +
          '<div class="tok-sound"><span aria-hidden="true">♫</span><div class="marq"><span>original sound · Chair Library · squeak squeak 🪑&nbsp;&nbsp;&nbsp;original sound · Chair Library · squeak squeak 🪑&nbsp;&nbsp;&nbsp;</span></div></div>' +
        '</div>' +
        '<div class="tok-disc" aria-hidden="true">🪑</div>' +
        '<div class="tok-bar" aria-hidden="true"><i></i></div>' +
      '</div>' +
    '</section>';
  }
  function tokEnd() {
    var waiting = CHAIRS.filter(function (c) { return c.d.identified !== 'confirmed'; });
    var noVideo = CHAIRS.length - TOK.length;
    var withPics = waiting.filter(function (c) { return c.ownPhotos.length; }).length;
    return '<section class="tok-slide tok-end"><div class="inner">' +
      '<div class="big" aria-hidden="true">🪑✨</div>' +
      '<h2>You’re all caught up!</h2>' +
      '<p>That was all ' + TOK.length + ' ChairToks. ' + noVideo + ' more chairs in the library have no video yet, and ' +
      waiting.length + ' chairs are still waiting to be identified' + (withPics ? ' (' + withPics + ' of them already have our own photos)' : '') + '.</p>' +
      '<p>Each chair’s page says what photo or question will identify it.</p>' +
      '<button type="button" data-tok="help">See what to do to identify them</button>' +
    '</div></section>';
  }
  function renderTok() {
    tokEl.innerHTML =
      '<div class="tok-feed" id="tokFeed">' + (TOK.length ? TOK.map(tokSlide).join('') : '') + tokEnd() + '</div>' +
      '<div class="tok-top"><button type="button" class="tok-exit" data-tok="exit" aria-label="Back to the Chair Library">← Library</button>' +
        '<div class="tok-tabs" aria-hidden="true"><span>Following</span><span class="on">For You</span></div></div>';
    var feed = document.getElementById('tokFeed');
    if (tokObserver) tokObserver.disconnect();
    tokObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting && e.intersectionRatio >= 0.6) tokActivate(e.target); });
    }, { root: feed, threshold: [0.6] });
    feed.querySelectorAll('.tok-slide').forEach(function (sl) {
      tokObserver.observe(sl);
      var ph = sl.querySelector('[data-photos]');
      if (!ph) return;
      var vv = ph.querySelector('.tok-video');
      if (vv) vv.addEventListener('ended', function () { if (sl === tokActive) tokPlay(); });
      var t = null;
      ph.addEventListener('scroll', function () {
        clearTimeout(t);
        t = setTimeout(function () { tokSyncDots(sl); if (sl === tokActive) tokPlay(); }, 120);
      }, { passive: true });
      var clickT = null;
      ph.addEventListener('click', function (ev) {
        clearTimeout(clickT);
        clickT = setTimeout(function () { sl.classList.toggle('paused'); if (sl === tokActive) tokPlay(); }, 260);
      });
      ph.addEventListener('dblclick', function (ev) {
        clearTimeout(clickT);
        tokLike(sl, true);
        var b = document.createElement('div');
        b.className = 'tok-burst'; b.textContent = '♥';
        var r = sl.querySelector('.tok-stage').getBoundingClientRect();
        b.style.left = (ev.clientX - r.left) + 'px'; b.style.top = (ev.clientY - r.top) + 'px';
        sl.querySelector('.tok-stage').appendChild(b);
        setTimeout(function () { b.remove(); }, 820);
      });
    });
    feed.focus && feed.setAttribute('tabindex', '-1');
    feed.focus({ preventScroll: true });
  }
  function tokIndex(sl) {
    var ph = sl.querySelector('[data-photos]');
    return ph ? Math.round(ph.scrollLeft / Math.max(1, ph.clientWidth)) : 0;
  }
  function tokSyncDots(sl) {
    var i = tokIndex(sl);
    sl.querySelectorAll('.tok-dots i').forEach(function (d, k) { d.classList.toggle('on', k === i); });
    var ph = sl.querySelector('[data-photos]'), img = ph && ph.children[i], bg = sl.querySelector('.tok-bg');
    if (img && bg) bg.style.backgroundImage = 'url("' + img.getAttribute('src') + '")';
  }
  function tokActivate(sl) {
    if (tokActive === sl) return;
    tokActive = sl;
    tokPlay();
  }
  // the "video": photos move on by themselves, with a progress bar at the bottom
  function tokPlay() {
    clearTimeout(tokTimer);
    cancelAnimationFrame(tokRaf);
    document.querySelectorAll('.tok-bar i').forEach(function (b) { b.style.transition = 'none'; b.style.width = '0'; });
    var sl = tokActive;
    document.querySelectorAll('.tok-video').forEach(function (v) { if (!sl || !sl.contains(v)) v.pause(); });
    var vid = sl && sl.querySelector('.tok-video');
    if (vid) {
      vid.muted = tokMuted;
      if (sl.classList.contains('paused')) { vid.pause(); return; }
      var pr = vid.play();
      if (pr && pr.catch) pr.catch(function () { vid.muted = true; tokMuted = true; tokSoundButtons(); vid.play().catch(function () { sl.classList.add('paused'); }); });
      var bar = sl.querySelector('.tok-bar i');
      (function tick() {
        if (vid.duration) bar.style.width = (100 * vid.currentTime / vid.duration) + '%';
        tokRaf = requestAnimationFrame(tick);
      })();
      return;
    }
    if (!sl || !sl.dataset.id || sl.classList.contains('paused') || reduceMotion) return;
    var bar = sl.querySelector('.tok-bar i');
    void bar.offsetWidth;
    bar.style.transition = 'width ' + TOK_STEP + 'ms linear';
    bar.style.width = '100%';
    tokTimer = setTimeout(function () {
      var ph = sl.querySelector('[data-photos]'), n = ph.children.length;
      if (n > 1) {
        var next = (tokIndex(sl) + 1) % n;
        ph.scrollTo({ left: next * ph.clientWidth, behavior: 'smooth' });
      } else {
        tokPlay();
      }
    }, TOK_STEP);
  }
  function tokSoundButtons() {
    tokEl.querySelectorAll('[data-tok="sound"].tok-btn').forEach(function (b) {
      b.setAttribute('aria-pressed', String(!tokMuted));
      b.querySelector('.ic').textContent = tokMuted ? '🔇' : '🔊';
      b.lastChild.textContent = tokMuted ? 'Sound' : 'Mute';
    });
    if (!tokMuted) tokEl.querySelectorAll('.tok-unmute').forEach(function (b) { b.remove(); });
  }
  function tokLike(sl, only) {
    var id = sl.dataset.id, btn = sl.querySelector('[data-tok="like"]');
    var on = only ? true : !tokLikes[id];
    if (on) tokLikes[id] = 1; else delete tokLikes[id];
    store.set('tokLikes', tokLikes);
    btn.classList.remove('liked'); void btn.offsetWidth;
    btn.classList.toggle('liked', on);
    btn.setAttribute('aria-pressed', String(on));
    btn.querySelector('.heart').textContent = on ? '♥' : '♡';
    btn.querySelector('.n').textContent = on ? '1' : 'Like';
  }
  function tokSheet(c) {
    var t = splitTitle(c.title), f = c.fields, d = c.d;
    var glance = sectionByName(c, /^at a glance/i), pros = sectionByName(c, /^pros/i), cons = sectionByName(c, /^cons/i);
    var wrap = document.createElement('div');
    wrap.className = 'tok-sheet-wrap';
    wrap.innerHTML = '<div class="tok-sheet" role="dialog" aria-modal="true" aria-label="Info about ' + esc(t.name) + '"><div class="grab"></div>' +
      '<h2>' + esc(t.name) + '</h2>' + (t.sub ? '<p class="sub">' + esc(t.sub) + '</p>' : '') +
      '<dl>' +
        '<dt>Price here</dt><dd>' + (d.price == null ? 'not known' : peso(d.price)) + '</dd>' +
        (d.priceJP != null ? '<dt>New in Japan</dt><dd>' + jpLine(c) + '</dd>' : '') +
        '<dt>Value</dt><dd>' + esc(VALUE_LABEL[d.value]) + (d.valuePct != null ? ' (' + Math.round(d.valuePct) + '% of new)' : '') + '</dd>' +
        (d.tierBrand ? '<dt>Model tier</dt><dd>' + esc(tierText(c)) + (d.tier ? ' · ' + esc(d.tier.series) : '') + '</dd>' : '') +
        '<dt>Seat height (cm)</dt><dd>' + esc(f.seat_height_cm) + '</dd>' +
        '<dt>Seat depth (cm)</dt><dd>' + esc(f.seat_depth_cm) + '</dd>' +
        '<dt>Seat slide</dt><dd>' + esc(f.seat_depth_slide) + '</dd>' +
        '<dt>Armrests</dt><dd>' + esc(f.armrests) + '</dd>' +
        '<dt>Back</dt><dd>' + esc(f.back) + '</dd>' +
        '<dt>Where</dt><dd>' + esc(placesText(c)) + '</dd>' +
      '</dl>' +
      (c.identify ? '<h3>🔍 How to identify it</h3><div class="md">' + (c.identify.html || '<p>Ask for one photo of the whole underside of the seat.</p>') + '</div>' : '') +
      (glance ? '<h3>At a glance</h3><div class="md">' + glance.html + '</div>' : '') +
      (pros ? '<h3>✓ Pros</h3><div class="md">' + pros.html + '</div>' : '') +
      (cons ? '<h3>✗ Cons</h3><div class="md">' + cons.html + '</div>' : '') +
      '<div class="row"><button type="button" class="close" data-x>Close</button><button type="button" class="go" data-go>Full chair page</button></div>' +
    '</div>';
    document.body.appendChild(wrap);
    clearTimeout(tokTimer);
    function close() { wrap.remove(); tokPlay(); }
    wrap.addEventListener('click', function (e) {
      if (e.target === wrap || e.target.closest('[data-x]')) close();
      if (e.target.closest('[data-go]')) { wrap.remove(); setTok(false); location.hash = '#chair/' + c.id; }
    });
    wrap.querySelector('[data-x]').focus();
  }
  tokEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-tok]');
    if (!b) return;
    var what = b.dataset.tok, sl = b.closest('.tok-slide'), c = sl && byId[sl.dataset.id];
    if (what === 'exit') setTok(false);
    else if (what === 'help') { setTok(false); cat.idOnly = false; if (location.hash) location.hash = ''; }
    else if (what === 'like') tokLike(sl);
    else if (what === 'sound') {
      tokMuted = !tokMuted; tokSoundButtons();
      var v = sl && sl.querySelector('.tok-video');
      if (v) { v.muted = tokMuted; if (v.paused && !sl.classList.contains('paused')) v.play().catch(function () {}); }
    }
    else if (what === 'info' && c) tokSheet(c);
    else if (what === 'pick' && c) {
      togglePick(c.id);
      var on = picked.indexOf(c.id) !== -1;
      b.classList.toggle('picked', on); b.setAttribute('aria-pressed', String(on));
      b.lastChild.textContent = on ? 'Picked' : 'Compare';
    } else if (what === 'share' && c) {
      var url = location.href.split('#')[0] + '#chair/' + c.id, name = splitTitle(c.title).name;
      if (navigator.share) navigator.share({ title: name + ' · ChairTok', url: url }).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { b.lastChild.textContent = 'Copied!'; setTimeout(function () { b.lastChild.textContent = 'Share'; }, 1500); });
    }
  });
  function setTok(on) {
    tokOn = !!on;
    store.set('tok', tokOn);
    tokSwitch.setAttribute('aria-pressed', String(tokOn));
    tokSwitch.title = tokOn ? 'Back to the Chair Library' : 'Switch to ChairTok, the simple photo view';
    document.body.classList.toggle('tok-on', tokOn);
    tokEl.hidden = !tokOn;
    if (tokOn) { if (isTokHash()) history.replaceState(null, '', location.pathname + location.search); renderTok(); document.title = 'ChairTok · Chair Library'; }
    else {
      clearTimeout(tokTimer); cancelAnimationFrame(tokRaf); tokActive = null;
      tokEl.querySelectorAll('.tok-video').forEach(function (v) { v.pause(); });
      if (tokObserver) tokObserver.disconnect();
      tokEl.innerHTML = '';
      route();
    }
  }
  tokSwitch.addEventListener('click', function () { setTok(!tokOn); });
  document.addEventListener('keydown', function (e) {
    if (!tokOn || e.key !== 'Escape') return;
    var sheet = document.querySelector('.tok-sheet-wrap');
    if (sheet) { sheet.remove(); tokPlay(); } else setTok(false);
  });

  // ---------- footer + routing ----------
  document.getElementById('footer').innerHTML =
    '<p>Made from ' + CHAIRS.length + ' chair files in Documents\\Chair Library\\chairs. Website rebuilt ' + esc(niceDate(DATA.builtOn)) + '.</p>' +
    '<p>Peso estimates of Japan prices use ' + esc(DATA.rate.text) + ', ' + esc(DATA.rate.source) + '. Rough guide only.</p>' +
    '<p>When chair files are added or changed, the website is rebuilt so new chairs show up here.</p>';

  function route() {
    if (currentView === 'catalogue') catScroll = window.scrollY;
    var h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    var parts = h.split('/');
    var view = parts[0] || 'catalogue';
    var arg = parts.slice(1).join('/');
    if (view === 'chair') renderChair(arg);
    else if (view === 'find') renderFind(arg);
    else if (view === 'compare') renderCompare();
    else if (view === 'store') renderStore();
    else if (view === 'tiers') renderTiers(arg);
    else { view = 'catalogue'; renderCatalogue(); }
    var prev = currentView;
    currentView = view;
    document.querySelectorAll('[data-nav]').forEach(function (a) {
      if (a.dataset.nav === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    updateTray();
    var titles = { catalogue: 'All chairs', find: 'Find my chair', compare: 'Compare chairs', store: 'In store', tiers: 'Model tiers' };
    document.title = (view === 'chair' && byId[arg] ? splitTitle(byId[arg].title).name : titles[view] || 'Chairs') + ' · Chair Library';
    if (view === 'find' && arg) return; // renderFind scrolls to the chair
    window.scrollTo(0, view === 'catalogue' && prev && prev !== 'catalogue' ? catScroll : 0);
    var h1 = app.querySelector('h1, h2[tabindex]');
    if (h1 && prev) h1.focus({ preventScroll: true });
  }
  function isTokHash() { return /^#\/?chairtok$/i.test(location.hash); }
  window.addEventListener('hashchange', function () { if (isTokHash()) setTok(true); else if (tokOn) setTok(false); else route(); });
  if (isTokHash()) { history.replaceState(null, '', location.pathname + location.search); setTok(true); }
  else { route(); if (store.get('tok', true) && !location.hash) setTok(true); }

  // keep the website on the phone, so it opens in a shop with no signal
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* saving offline is not available here */ });
    });
  }
})();
</script>
</body>
